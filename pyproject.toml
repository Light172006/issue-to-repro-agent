[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-to-repro-agent"
version = "0.0.1"
description = "Turn GitHub bug reports into verified reproductions."
requires-python = ">=3.11,<3.12"
dependencies = ["openai>=1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
