[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-to-repro-agent"
version = "0.0.1"
description = "Turn GitHub bug reports into verified reproductions."
requires-python = ">=3.11,<3.12"
dependencies = ["openai>=1.66,<3", "httpx>=0.27,<1", "docker>=7,<8", "pydantic>=2,<3", "typer>=0.12,<1", "jinja2>=3.1,<4"]

[project.scripts]
repro = "repro.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a local Docker daemon", "network: requires access to an external service"]

[tool.ruff.lint.per-file-ignores]
# Saved reproductions are immutable evidence of the original agent output.
"examples/v0.2-boltons/test_repro.py" = ["I001"]
"proof/v0.3/test_repro.orig.py" = ["I001"]
"proof/v0.3/test_repro.py" = ["I001", "F841"]
# These fixtures intentionally contain unused imports and verbose code to minimize.
"tests/fixtures/minimizer/bloated.py" = ["I001", "F401", "PERF402"]
"tests/fixtures/minimizer/boltons_bloated.py" = ["I001", "F401"]

