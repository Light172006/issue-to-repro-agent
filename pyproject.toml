[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-to-repro-agent"
version = "0.0.1"
description = "Turn GitHub bug reports into verified reproductions."
requires-python = ">=3.11,<3.12"
dependencies = ["openai>=1.66,<3", "httpx>=0.27,<1", "docker>=7,<8", "pydantic>=2,<3", "typer>=0.12,<1", "jinja2>=3.1,<4"]

[project.scripts]
repro = "repro.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["docker: requires a local Docker daemon", "network: requires access to an external service"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Saved reproductions and benchmark harnesses are immutable evaluation artifacts.
"examples/**" = ["ALL"]
"bench/**" = ["ALL"]
"proof/**" = ["ALL"]
"tests/fixtures/minimizer/**" = ["ALL"]
